="none" stroke="#52c8d7" stroke-width="6" marker-end="url(#arrow)"/></g><path d="M620 300h485" stroke="#fff" stroke-opacity=".16" stroke-width="2"/><text x="660" y="375" fill="#52c8d7" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">TRAINING CUE</text><text x="660" y="435" fill="#f1f5fb" font-family="Arial,sans-serif" font-size="28" font-weight="700">PRESS PATTERN</text><text x="660" y="490" fill="#b9c9df" font-family="Arial,sans-serif" font-size="23">Use a range that feels</text><text x="660" y="527" fill="#b9c9df" font-family="Arial,sans-serif" font-size="23">steady and comfortable.</text><rect x="660" y="595" width="425" height="105" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/><circle cx="702" cy="647" r="11" fill="#52c8d7"/><text x="730" y="641" fill="#f1f5fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">FORM FIRST</text><text x="730" y="675" fill="#b9c9df" font-family="Arial,sans-serif" font-size="18">Smooth reps · breathe normally</text><text x="85" y="810" fill="#b9c9df" font-family="Arial,sans-serif" font-size="18">Illustrative training aid · follow the plan's written instructions</text></svg>