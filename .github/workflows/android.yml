# Builds and tests Android changes on GitHub, including checks that release signing is required.
name: Android build and tests
on:
  push:
    paths: ['mobile-app/**', 'website/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile-app/**', 'website/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # Override the default, which includes the unavailable legacy 'tools' package.
          packages: platform-tools
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint and build debug APK
        working-directory: mobile-app
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CFJ-Android-debug
          path: mobile-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run website preview on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: mobile-app
          script: |
            adb shell input keyevent 82
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e mode website za.co.cfjlifestylefitness.app.test/za.co.cfjlifestylefitness.app.ProfileConnectionInstrumentation | tee "$RUNNER_TEMP/website-smoke.txt"
            grep -F 'WEBSITE_SMOKE_OK' "$RUNNER_TEMP/website-smoke.txt"
            mkdir -p app/build/website-evidence
            adb pull /sdcard/Android/data/za.co.cfjlifestylefitness.app/files/. app/build/website-evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CFJ-Android-test-evidence
          path: |
            mobile-app/app/build/website-evidence/
            mobile-app/app/build/reports/tests/
            mobile-app/app/build/reports/lint-results-debug.html
            ${{ runner.temp }}/website-smoke.txt
            ${{ runner.temp }}/emulator.log
      - name: Verify release packaging requires signing
        working-directory: mobile-app
        run: |
          if bash ./gradlew assembleRelease --no-daemon > "$RUNNER_TEMP/release-guard.log" 2>&1; then
            echo 'Unsigned release unexpectedly succeeded'
            exit 1
          fi
          grep -F 'Release signing is not configured' "$RUNNER_TEMP/release-guard.log"
      - name: Verify release signing with a temporary certificate
        working-directory: mobile-app
        run: |
          export CFJ_RELEASE_STORE_FILE="$RUNNER_TEMP/cfj-verification.jks"
          export CFJ_RELEASE_STORE_PASSWORD="$(openssl rand -hex 24)"
          export CFJ_RELEASE_KEY_PASSWORD="$CFJ_RELEASE_STORE_PASSWORD"
          export CFJ_RELEASE_KEY_ALIAS='verification-only'
          echo "::add-mask::$CFJ_RELEASE_STORE_PASSWORD"
          trap 'rm -f "$CFJ_RELEASE_STORE_FILE"' EXIT
          keytool -genkeypair -keystore "$CFJ_RELEASE_STORE_FILE" -storepass:env CFJ_RELEASE_STORE_PASSWORD -keypass:env CFJ_RELEASE_KEY_PASSWORD -alias "$CFJ_RELEASE_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=CFJ Temporary Build Verification' -noprompt
          bash ./gradlew lintRelease assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
