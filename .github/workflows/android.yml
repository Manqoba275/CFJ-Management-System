name: Android build and tests
on:
  push:
    paths: ['mobile-app/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile-app/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # Override the default, which includes the unavailable legacy 'tools' package.
          packages: platform-tools
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint and build debug APK
        working-directory: mobile-app
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CFJ-Android-debug
          path: mobile-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
