name: Setup checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  website-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check website source and local assets
        run: node scripts/check-website.mjs
      - name: Test local preview server
        run: node --test scripts/serve-website.test.mjs
