<!doctype html>
<!-- Real Firebase accounts are kept separate from the browser-only membership preview. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CFJ account</title><style>body{margin:0;background:#0b1426;color:#edf4ff;font:17px/1.6 system-ui}main{max-width:540px;margin:40px auto;padding:28px;background:#15263f;border-radius:16px}label,input{display:block}input{box-sizing:border-box;width:100%;padding:14px;margin:6px 0 18px;background:#0b1426;color:white;border:1px solid #93b5df;border-radius:6px}button{padding:13px;margin:6px 4px 6px 0;border:0;border-radius:6px;background:#8bc0ff;color:#102542;font:inherit;cursor:pointer}button:disabled{opacity:.5}a{color:#a4ceff}:focus-visible{outline:3px solid #fff}#status{min-height:3em}</style></head><body><main><a href="index.html">← CFJ home</a><h1>Your CFJ account</h1><p>Sign in with your email or Google account.</p><form id="account-form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button><button type="button" id="register">Create account</button></form><button id="google">Continue with Google</button><button id="reset">Reset password</button><section id="signed-in" hidden><p id="identity"></p><button id="verify">Send verification email</button><button id="reload">Check verification</button><button id="logout">Sign out</button></section><section id="api-panel"><h2>Shared member records</h2><label for="api-origin">API address</label><input id="api-origin" type="url" value="http://127.0.0.1:8789"><button id="api-load">Load memberships and bookings</button><div id="api-records"></div></section><p id="status" role="status">Loading account service…</p><p>Shared memberships and bookings will become available once the database connection is ready.</p><noscript>Enable JavaScript to use account sign-in.</noscript></main><script type="module" src="firebase-account.js"></script></body></html>
