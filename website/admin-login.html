<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CFJ Lifestyle Fitness | Admin Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="admin-login">
  <header class="topbar">
    <a class="brand" href="index.html"><img src="assets/cfj-logo-app.png" alt="CFJ logo"><span>CFJ Lifestyle Fitness</span></a>
    <nav class="nav"></nav>
    <a class="nav-login active" href="login.html">Signup</a>
  </header>
  <main class="auth-page redesigned-auth">
    <section class="auth-shell login-only reveal">
      <div class="auth-showcase">
        <p class="eyebrow">Admin Access</p>
        <h1>Management reports.</h1>
        <p>Admins can view reports, manage staff access, review payments, and monitor member records.</p>
      </div>
      <form class="auth-card active-auth-form" id="adminLoginForm">
        <h2>Admin login.</h2>
        <label>Admin email<input id="adminEmail" type="email" required></label>
        <label>Password<input id="adminPassword" type="password" required></label>
        <button class="primary-button" type="submit">Login As Admin</button>
      </form>
    </section>
  </main>
  <footer class="site-footer"></footer>
  <div class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
