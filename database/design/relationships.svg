id</text><rect x="420" y="710" width="290" height="90" rx="8" fill="white" stroke="#12477b" stroke-width="2"/><text x="432" y="734" font-family="Arial" font-size="15" fill="#18334f">CFJ_EVENT_REGISTRATIONS</text><text x="432" y="757" font-family="Arial" font-size="13" fill="#18334f">PK registration_id; FK event_id</text><text x="40" y="845" font-family="Arial" font-size="16" fill="#18334f">Pair tables have two member FKs. Exact constraints and cardinalities: database/design/README.md.</text><text x="40" y="875" font-family="Arial" font-size="16" fill="#18334f">14 tables; synthetic data only. No passwords. Operational API integration remains outstanding.</text></svg>